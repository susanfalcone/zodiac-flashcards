      SIGNS.map(function (s) { return h("option", { value: s.n }, s.n); }));
    knownSel.value = S.knownRising;
    var saveBtn = h("button", { class: "btn", type: "button", id: "save", onclick: function () { sendRun(knownSel.value, msg); } }, S.sentText ? "Send again" : "Send my result");
    var msg = h("p", { class: "small", role: "status", text: S.saved || "" });
    var box = S.sentText ? h("textarea", { readonly: true, rows: "7", "aria-label": "Your result, to copy", style: "width:100%;font:12px ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)", onfocus: function (e) { e.target.select(); } }) : null;
    if (box) box.value = S.sentText;
    return h("section", { style: "display:flex;flex-direction:column;gap:20px" },
      h("div", { class: "card" },
        h("div", { class: "row", style: "justify-content:space-between" },
          h("p", { class: "eyebrow", text: "Your result" }),
          h("span", { class: "badge " + cls, text: R.label })),
        h("h2", { text: headline }),
        strip({ cands: S.cands, sun: S.sun, top: tie ? null : top.sign }),
        h("div", { class: "rank" }, bars),
        h("p", { text: SIGNS[top.sign].n + " is " + SIGNS[top.sign].el + ", " + SIGNS[top.sign].mo + ". People often describe this rising sign this way: " + d6a.lines[top.sign].toLowerCase() + "." }),
        R.sunTop ? h("p", { class: "note", text: "Your sun sign came out on top. These questions cannot fully separate sun from rising, so treat this as a lean, not a finding." }) : null,
        R.none >= 3 ? h("p", { class: "note", text: "You chose none of these fit on " + R.none + " questions, so the right sign may not be among the candidates." }) : null,
        h("p", { class: "small muted", text: "A rising sign description is not a description of you. You are a blend of sun, moon and rising. Only a chart with your real birth time gives the exact answer." })),
      tie ? h("div", { class: "card" },
        h("h3", { text: "Ways to break the tie" }),
        h("p", { text: "Show a friend who met you as an adult these two first impressions and ask which sounds like how you came across at first:" }),
        h("ul", { style: "margin:0;padding-left:20px" }, [top.sign, second.sign].map(function (c) { return h("li", { text: d6a.lines[c] }); })),
        h("p", { text: "A certified astrologer can also work out a birth time from the dates of major life events. This is called chart rectification." })) : null,
      h("div", { class: "card" },
        h("h3", { text: "Help test this tool" }),
        h("p", { class: "small muted", text: "If you know your real rising sign from a birth chart, pick it. Then send your result to Susan so she can see how well the tool did. The message includes your answers and your birth city, but not your birth date." }),
        h("div", { class: "field" }, h("label", { for: "f-known", text: "Actual rising sign" }), knownSel),
        h("div", { class: "row" }, saveBtn,
          h("button", { class: "btn ghost", type: "button", onclick: function () { S = fresh(); render(); } }, "Start over")),
        msg, box));
  }

  function sendRun(known, msg) {
    var R = S.result;
    var answers = {};
    Object.keys(S.ans).forEach(function (k) {
      var p = S.ans[k];
      answers[k] = { c: p.c, a: p.a, none: !!p.none };
    });
    var doc = {
      v: 1, bank: 5, screening: S.screenScores || null, sunTop: R.sunTop, daypart: S.daypart || null, createdAt: Date.now(), label: S.label, sun: SIGNS[S.sun].n, cusp: S.cusp, path: S.path,
      window: S.windowIdx != null ? WINDOWS[S.windowIdx].label : null,
      place: S.place ? S.place.name : null,
      candidates: S.cands.map(function (c) { return SIGNS[c].n; }),
      elementScores: S.el, modeScores: S.mo,
      ranking: R.rank.map(function (r) { return { sign: SIGNS[r.sign].n, score: r.score }; }),
      margin: Math.round(R.margin * 1000) / 1000, confidence: R.label, noneCount: R.none, sunPicks: R.sunPicks,
      answers: answers, known: known || null
    };
    S.knownRising = known;
    var top = R.rank[0], sec = R.rank[1];
    var text = "Rising Sign Finder result\nTop match: " + SIGNS[top.sign].n + " (" + R.label + ")" + (sec ? ". Runner-up: " + SIGNS[sec.sign].n : "") +
      "\nSun sign: " + SIGNS[S.sun].n + ". Path: " + (S.path === "window" ? "time window" : "no time") + ". Actual rising: " + (known || "not known") +
      "\nRSF1:" + JSON.stringify(doc);
    S.sentText = text;
    S.saved = "Copied. Paste it into a message to Susan.";
    function done(ok) { S.saved = ok ? "Shared. If nothing opened, copy the text below and send it to Susan." : "Copy the text below and send it to Susan."; render(); }
    if (navigator.share) { navigator.share({ title: "Rising Sign Finder result", text: text }).then(function () { done(true); }).catch(function () { done(false); }); }
    else if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { S.saved = "Copied. Paste it into a message to Susan."; render(); }).catch(function () { done(false); }); }
    else { done(false); }
  }

  /* ---------- Test log ---------- */
  var KEY = "rsf_runs_v1";
  function loadRows() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } }
  function saveRows(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
  function renderLogShell() {
    var host = h("div", { id: "log-host" });
    var ta = h("textarea", { rows: "5", "aria-label": "Paste results", placeholder: "Paste one or more tester messages here", style: "width:100%;font:13px ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)" });
    var info = h("p", { class: "small muted" });
    var add = h("button", { class: "btn", type: "button", onclick: function () {
      var found = ta.value.match(/RSF1:\{.*\}/g) || [], rows = loadRows(), n = 0;
      found.forEach(function (f) { try { var d = JSON.parse(f.slice(5)); if (!rows.some(function (r) { return r.createdAt === d.createdAt && r.label === d.label && r.sun === d.sun; })) { rows.push(d); n++; } } catch (e) {} });
      rows.sort(function (x, y) { return y.createdAt - x.createdAt; });
      saveRows(rows); ta.value = ""; renderLogShell(); }
    }, "Add to log");
    app.replaceChildren(h("section", { class: "card" }, h("h2", { text: "Add tester results" }), ta, h("div", { class: "row" }, add), info), host);
    info.textContent = "Stored in this browser only.";
    host.replaceChildren(logView(loadRows()));
  }
  function logView(rows) {
    if (!rows.length) {
      return h("section", { class: "card empty" }, h("h2", { text: "Test log" }),
        h("p", { text: "No runs saved yet. Take the quiz, pick your actual rising sign if you know it, and choose Save to test log. Each run adds a row here with its result and whether it matched." }));
    }
    function stat(v, l) { return h("div", {}, h("b", { text: v }), h("span", { class: "small muted", text: l })); }
    function block(title, rs) {
      var k = rs.filter(function (r) { return r.known; });
      var t1 = k.filter(function (r) { return r.ranking && r.ranking[0] && r.ranking[0].sign === r.known; }).length;
      var t2 = k.filter(function (r) { return (r.ranking || []).slice(0, 2).some(function (x) { return x.sign === r.known; }); }).length;
      var ic = k.filter(function (r) { return (r.candidates || []).indexOf(r.known) >= 0; }).length;
      function of(n) { return k.length ? n + " of " + k.length : "None yet"; }
      return h("div", { style: "display:flex;flex-direction:column;gap:10px" }, h("h3", { text: title }),
        h("div", { class: "stats" }, stat(String(rs.length), "runs saved"), stat(of(t1), "top match correct"), stat(of(t2), "in top two"), stat(of(ic), "in candidate list")));
    }
    var winRows = rows.filter(function (r) { return r.path === "window"; });
    var noRows = rows.filter(function (r) { return r.path !== "window"; });
    var body = rows.map(function (r) {
      var top = r.ranking && r.ranking[0] ? r.ranking[0].sign : "";
      var sec = r.ranking && r.ranking[1] ? r.ranking[1].sign : "";
      var res = "", cls = "";
      if (r.known) { if (top === r.known) { res = "Top match"; cls = "hit"; } else if (sec === r.known) { res = "Runner-up"; cls = "near"; } else { res = "Missed"; cls = "miss"; } }
      return h("tr", {},
        h("td", { text: new Date(r.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric" }) }),
        h("td", { text: r.label || "" }),
        h("td", { text: r.sun || "" }),
        h("td", { text: r.path === "window" ? "Time window" : (r.daypart ? "Day or night" : "No time") }),
        h("td", { text: r.bank ? "v" + r.bank : "v1" }),
        h("td", { text: (r.candidates || []).join(", ") }),
        h("td", { text: top + (sec ? " / " + sec : "") }),
        h("td", { text: r.confidence || "" }),
        h("td", { text: r.known || "" }),
        h("td", { class: cls, text: res }));
    });
    return h("section", { style: "display:flex;flex-direction:column;gap:20px" },
      h("div", { class: "card" },
        h("h2", { text: "Test log" }),
        block("Time window", winRows),
        block("No time, or day or night only", noRows),
        h("p", { class: "small muted", text: "Scores count only runs where the tester entered a known rising sign. The candidate list shows how often the narrowing step kept the true sign. The two paths are scored separately because the no-time path has to choose among many more signs." })),
      h("div", { class: "card" }, h("div", { class: "tablewrap" }, h("table", {},
        h("thead", {}, h("tr", {}, ["Date", "Label", "Sun", "Path", "Ver", "Candidates", "Result", "Confidence", "Actual", "Outcome"].map(function (t) { return h("th", { text: t }); }))),
        h("tbody", {}, body)))));
  }

  /* ---------- Routing ---------- */
  var view = "quiz";
  function setView(v) {
    view = v;
    document.getElementById("tab-quiz").setAttribute("aria-current", v === "quiz" ? "page" : "false");
    document.getElementById("tab-log").setAttribute("aria-current", v === "log" ? "page" : "false");
    if (logUnsub && v !== "log") { logUnsub(); logUnsub = null; }
    render();
  }
  function render() {
    if (view === "log") { renderLogShell(); return; }
    var node = S.screen === "setup" ? renderSetup() : S.screen === "q" ? renderQuestion() : renderResult();
    app.replaceChildren(node);
    if (S.screen !== "setup") window.scrollTo({ top: 0 });
  }
  document.getElementById("tab-quiz").addEventListener("click", function () { setView("quiz"); });
  document.getElementById("tab-log").addEventListener("click", function () { setView("log"); });

  render();

  if (location.hash === "#log") { document.getElementById("tab-log").hidden = false; setView("log"); }
})();
</script>

</body></html>
