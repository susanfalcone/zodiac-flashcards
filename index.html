<style>
/* Layout: single flip-card "study deck" — glyph rail for navigation above, prev/next below, deep celestial neutrals with 4 elemental accent hues */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --fg:#191b26; --fg-dim:#565a6e; --border:#d6d9e2;
  --gold:#a3812f;
  --fire:#c8461b; --earth:#5b7a3f; --air:#b8901f; --water:#1f7a8c;
  --good:#2f7d4f; --bad:#b0432c;
  --font-display:'Fraunces',Georgia,serif; --font-body:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12131d; --surface:#1b1d2a; --surface-2:#242739; --fg:#e9e9f2; --fg-dim:#a3a6ba; --border:#33364a;
    --gold:#d4b463;
    --fire:#e2703f; --earth:#8bad63; --air:#e0b944; --water:#4fb3c4;
    --good:#5cb87f; --bad:#e07a5f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12131d; --surface:#1b1d2a; --surface-2:#242739; --fg:#e9e9f2; --fg-dim:#a3a6ba; --border:#33364a;
  --gold:#d4b463;
  --fire:#e2703f; --earth:#8bad63; --air:#e0b944; --water:#4fb3c4;
  --good:#5cb87f; --bad:#e07a5f;
  color-scheme: dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);padding-inline:16px;padding-block:12px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0}

.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.src{margin:0;text-align:center;font-size:.78rem;color:var(--fg-dim);font-style:italic}

/* glyph rail */
.rail{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.rail button{
  width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface-2);
  color:var(--elcolor,var(--fg));font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.rail button:hover{transform:translateY(-2px)}
.rail button[aria-current="true"]{border-color:var(--elcolor,var(--gold));background:color-mix(in srgb, var(--elcolor,var(--gold)) 18%, var(--surface));font-weight:700}
.rail button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* card */
.card-outer{width:100%;perspective:1600px;container-type:inline-size;will-change:transform}

/* controls: full-width bar below the card, sized for easy thumb taps */
.controls{display:flex;align-items:stretch;gap:8px}
.navbtn{
  flex:1;min-height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface);
  color:var(--fg);font-family:var(--font-body);font-size:1rem;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.navbtn:hover{background:var(--surface-2)}
.navbtn:active{transform:scale(.97)}
.navbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.navbtn .arrow{font-size:1.2rem;line-height:1}
.counter{flex:0 0 auto;min-width:96px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.76rem;color:var(--fg-dim);padding:0 6px}
.card{
  position:relative;height:440px;border-radius:20px;cursor:pointer;touch-action:pan-y;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1), height .25s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--border);
  background:var(--surface);display:flex;flex-direction:column;overflow:hidden;
}
.face.back{transform:rotateY(180deg);overflow-y:auto}

/* front face */
.front{align-items:center;justify-content:center;text-align:center;gap:clamp(8px,2.4cqi,16px);padding:clamp(20px,5cqi,40px);
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--elcolor) 16%, transparent), transparent 60%),
    var(--surface);
}
.front .glyph{font-size:clamp(4.5rem,30cqi,9rem);color:var(--elcolor);line-height:1}
.front h2{font-size:clamp(1.8rem,9cqi,3.4rem);color:var(--fg)}
.front .dates{font-family:var(--font-mono);color:var(--fg-dim);font-size:clamp(.95rem,3.6cqi,1.35rem);letter-spacing:.02em}
.front .tagline{max-width:32ch;color:var(--fg-dim);font-size:clamp(.95rem,3.8cqi,1.35rem);font-style:italic}
.front .hint{position:absolute;top:14px;font-size:clamp(.72rem,2.4cqi,.9rem);color:var(--fg-dim);letter-spacing:.06em;text-transform:uppercase}
.front .housenum{
  width:clamp(32px,7cqi,46px);height:clamp(32px,7cqi,46px);border-radius:50%;
  border:1.5px solid var(--elcolor);color:var(--elcolor);background:var(--surface);
  font-family:var(--font-mono);font-weight:700;font-size:clamp(.92rem,3cqi,1.3rem);
  display:flex;align-items:center;justify-content:center;
}

/* back face */
.back{padding:18px 18px 22px}
.back .bhead{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:2px solid var(--elcolor);margin-bottom:12px}
.back .bhead .g{font-size:1.6rem;color:var(--elcolor)}
.back .bhead h3{font-size:1.3rem}
.back .bhead .em{margin-left:auto;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--elcolor);font-weight:700}

.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-dim);font-weight:600;margin:0 0 6px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.86rem;margin-bottom:14px}
.facts div.k{color:var(--fg-dim)}
.facts div.v{font-family:var(--font-mono);text-align:right}
.facts .row{display:contents}

.qual-block{margin-bottom:12px}
.lifelesson{margin:0;font-size:.86rem;font-style:italic;line-height:1.5;color:var(--fg);padding-left:10px;border-left:3px solid var(--elcolor)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.74rem;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg)}
.chip.tag{border-color:var(--elcolor);color:var(--elcolor)}

.ev-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
@media(min-width:460px){.ev-grid{grid-template-columns:1fr 1fr}}
.ev-col{border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.ev-col.good{border-left:3px solid var(--good)}
.ev-col.bad{border-left:3px solid var(--bad)}
.ev-col .t{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:6px}
.ev-col.good .t{color:var(--good)}
.ev-col.bad .t{color:var(--bad)}
.ev-col ul{margin:0;padding-left:1.1em;font-size:.82rem;line-height:1.5}
.ev-col li{margin-bottom:3px}


/* deck switcher and shared pieces for planets, elements, and modes */
.decks{display:flex;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.decks button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--fg-dim);font-family:var(--font-body);font-size:.8rem;font-weight:600;cursor:pointer;padding:0 2px}
.decks button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--gold)}
.decks button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rail button.small{font-size:.7rem;font-weight:600;font-family:var(--font-mono)}
.rail button svg{display:block}
.front .glyph svg{width:1em;height:1em;display:block}
.front .glyph .pair{display:inline-flex;align-items:center;gap:.12em}
.front .glyph.num{font-family:var(--font-display);font-weight:600;font-size:clamp(4.5rem,30cqi,9rem)}
.front .glyph .plus{font-size:.4em;color:var(--fg-dim);font-family:var(--font-mono)}
.front .glyph .signrow{font-size:.42em;letter-spacing:.18em;white-space:nowrap}
.back .bhead .g .pair{display:inline-flex;align-items:center;gap:4px}
.back .bhead .g .plus{font-size:.8rem;color:var(--fg-dim)}
.back .bhead .g .signrow{font-size:1.1rem;letter-spacing:.12em}
.ev-col.plain{border-left:3px solid var(--elcolor,var(--gold))}
.facts div.v .trad,.note{color:var(--fg-dim)}
.note{margin:12px 0 0;font-size:.74rem;font-style:italic;line-height:1.5}
.trad{font-size:.74rem}

@media (prefers-reduced-motion: reduce){ .card{transition:none} .rail button{transition:none} }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<div class="wrap">

</div>

/* ---------- helpers ---------- */
function elSvg(el, px){
  const up = (el==="Fire"||el==="Air"), bar = (el==="Air"||el==="Earth");
  const tri = up ? "12,3 22,20 2,20" : "2,4 22,4 12,21";
  const y = up ? 14 : 10;
  return `<svg viewBox="0 0 24 24" width="${px||24}" height="${px||24}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><polygon points="${tri}"/>${bar?`<line x1="5.5" y1="${y}" x2="18.5" y2="${y}"/>`:''}</svg>`;
}
function chips(list, tag){ return list.map(x=>`<span class="chip${tag?' tag':''}">${x}</span>`).join(''); }
function facts(rows){ return `<div class="facts">${rows.map(r=>`<div class="k">${r[0]}</div><div class="v">${r[1]}</div>`).join('')}</div>`; }
function block(label, inner){ return `<div class="qual-block"><p class="label">${label}</p>${inner}</div>`; }
function bhead(g, name, tag){ return `<div class="bhead"><span class="g">${g}</span><h3>${name}</h3><span class="em">${tag}</span></div>`; }
function bullets(list){ return `<div class="ev-col plain"><ul>${list.map(x=>`<li>${x}</li>`).join('')}</ul></div>`; }
function roads(hi, lo){ return `<p class="label">High road / low road</p><div class="ev-grid"><div class="ev-col good"><div class="t">High road</div><ul>${hi.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="ev-col bad"><div class="t">Low road</div><ul>${lo.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`; }
function front(glyph, name, mono, tagline, extra){
  return `${extra||''}<div class="glyph">${glyph}</div><h2>${name}</h2><div class="dates">${mono}</div><div class="tagline">${tagline}</div><div class="hint">Tap to flip · Swipe for next</div>`;
}

const total = ()=> cur().items.length;

try{ const saved = JSON.parse(localStorage.getItem('astroCards')||'null'); if(saved && DECKS[saved.deck]){ deckKey=saved.deck; idx=Math.min(saved.idx|0, DECKS[saved.deck].items.length-1); } }catch(e){}
function save(){ try{ localStorage.setItem('astroCards', JSON.stringify({deck:deckKey, idx})); }catch(e){} }

Object.keys(DECKS).forEach(k=>{
  const b = document.createElement('button');
  b.textContent = DECKS[k].label; b.dataset.deck = k;
  b.addEventListener('click', ()=> setDeck(k));
  decksEl.appendChild(b);
});

function buildRail(){
  rail.innerHTML = '';
  cur().items.forEach((it,i)=>{
    const r = cur().rail(it);
    const b = document.createElement('button');
    b.innerHTML = r.html; b.title = r.title; b.setAttribute('aria-label', r.title);
    if(r.small) b.classList.add('small');
    b.style.setProperty('--elcolor', r.color);
    b.addEventListener('click', ()=>{ goTo(i, i>idx ? +1 : -1); });
    rail.appendChild(b);
  });
}

function setDeck(k){
  if(k===deckKey || busy) return;
  deckKey = k; idx = 0; flipped = false;
  resetOuter(); buildRail(); render();
}

function render(){
  const d = cur(), it = d.items[idx];
  cardEl.style.setProperty('--elcolor', d.color(it));
  cardEl.classList.toggle('flipped', flipped);
  frontEl.innerHTML = d.front(it);
  backEl.innerHTML = d.back(it);
  backEl.scrollTop = 0;
  [...rail.children].forEach((b,i)=> b.setAttribute('aria-current', i===idx ? 'true':'false'));
  [...decksEl.children].forEach(b=> b.setAttribute('aria-pressed', b.dataset.deck===deckKey ? 'true':'false'));
  counterEl.textContent = `${idx+1} / ${total()} · ${d.counter(it)}`;
  document.getElementById('prevBtn').setAttribute('aria-label', 'Previous '+d.plural);
  document.getElementById('nextBtn').setAttribute('aria-label', 'Next '+d.plural);
  save();
  sizeCard();
}

function sizeCard(){
  // Faces are absolutely positioned, so scrollHeight still reports full content
  // height even while clipped. Grow the card to fit the taller face so nothing gets cut off.
  requestAnimationFrame(()=>{
    const w = cardEl.offsetWidth;
    const base = Math.round(Math.max(360, Math.min(w*1.15, window.innerHeight*0.62, 620)));
    cardEl.style.transition = 'none';
    cardEl.style.height = base + 'px';
    // Cap at ~72% of the viewport so Prev/Next stay on screen; the back face scrolls inside the card.
    const cap = Math.max(base, Math.round(window.innerHeight*0.72));
    const needed = Math.min(cap, Math.max(base, backEl.scrollHeight));
    cardEl.style.height = needed + 'px';
    void cardEl.offsetHeight;
    cardEl.style.transition = '';
  });
}
window.addEventListener('resize', sizeCard);

const reduceMotion = ()=> window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let busy = false, dragX = 0;
function resetOuter(){ outerEl.style.transform=''; outerEl.style.opacity=''; dragX=0; }

// dir = +1 slides the old card out to the left (next), -1 out to the right (previous).
async function goTo(newIdx, dir){
  if(busy || newIdx===idx) return;
  busy = true;
  const swap = ()=>{ idx=newIdx; flipped=false; render(); };
  if(reduceMotion()){ resetOuter(); swap(); busy=false; return; }
  const w = outerEl.offsetWidth;
  const from = dragX;
  const pose = (x)=>({ transform:`translateX(${x}px) rotate(${x/w*8}deg)`, opacity: Math.max(0, 1-Math.abs(x)/w*0.9) });
  resetOuter();
  await outerEl.animate([pose(from), pose(-dir*w*0.55)], {duration:170, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards'}).finished;
  swap();
  await outerEl.animate([pose(dir*w*0.55), pose(0)], {duration:300, easing:'cubic-bezier(.2,.9,.2,1.05)', fill:'forwards'}).finished;
  outerEl.getAnimations().forEach(a=>a.cancel());
  busy = false;
}
const goNext = ()=> goTo((idx+1)%total(), +1);
const goPrev = ()=> goTo((idx-1+total())%total(), -1);

// Swipe left = next card, swipe right = previous card. The card follows your finger. Tap still flips.
let tx=0, ty=0, tt=0, swiped=false, dragging=false;
cardEl.addEventListener('touchstart', (e)=>{
  if(e.touches.length!==1 || busy) return;
  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now(); swiped=false; dragging=false;
}, {passive:true});
cardEl.addEventListener('touchmove', (e)=>{
  if(busy) return;
  const t=e.touches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(!dragging && Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.5) dragging=true;
  if(!dragging) return;
  const w=outerEl.offsetWidth;
  dragX = dx*0.7;
  outerEl.style.transform = `translateX(${dragX}px) rotate(${dragX/w*8}deg)`;
  outerEl.style.opacity = Math.max(0.5, 1-Math.abs(dragX)/w*0.9);
}, {passive:true});
cardEl.addEventListener('touchend', (e)=>{
  if(!dragging) return;
  dragging=false; swiped=true;
  const dx=e.changedTouches[0].clientX-tx, quick=Date.now()-tt<400;
  if(Math.abs(dx)>70 || (quick && Math.abs(dx)>35)){
    dx<0 ? goNext() : goPrev();
  } else {
    // not far enough: spring back
    const from=dragX, w=outerEl.offsetWidth;
    resetOuter();
    outerEl.animate([{transform:`translateX(${from}px) rotate(${from/w*8}deg)`},{transform:'none'}], {duration:260, easing:'cubic-bezier(.2,.9,.2,1.1)'});
  }
}, {passive:true});
cardEl.addEventListener('touchcancel', ()=>{ if(dragging){ dragging=false; resetOuter(); } }, {passive:true});

cardEl.addEventListener('click', (e)=>{ if(swiped){ swiped=false; return; } flipped = !flipped; cardEl.classList.toggle('flipped', flipped); });
cardEl.addEventListener('keydown', (e)=>{
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipped=!flipped; cardEl.classList.toggle('flipped', flipped); }
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') goPrev();
});
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('prevBtn').addEventListener('click', goPrev);

buildRail();
render();
</script>

</body>
</html>
